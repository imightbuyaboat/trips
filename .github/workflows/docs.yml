name: Docs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: false

    - name: Generate API docs from code
      run: |
        go install github.com/princjef/gomarkdoc/cmd/gomarkdoc@latest
        mkdir -p site
        gomarkdoc --include-unexported --output site/api.raw.md .
        { printf -- '---\ntitle: API\n---\n'; cat site/api.raw.md; } > site/api.md
        rm site/api.raw.md
        { printf -- '---\ntitle: trips\n---\n'; cat README.md; } > site/index.md
        printf 'theme: jekyll-theme-cayman\ntitle: trips\n' > site/_config.yml

    - uses: actions/configure-pages@v5

    - uses: actions/jekyll-build-pages@v1
      with:
        source: ./site
        destination: ./_site

    - uses: actions/upload-pages-artifact@v3

    - name: Deploy
      id: deployment
      uses: actions/deploy-pages@v4
